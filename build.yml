name: Dhis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.9' }
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk JadwalkaIlmo.apk
      - uses: actions/upload-artifact@v4
        with: { name: JadwalkaIlmo-apk, path: JadwalkaIlmo.apk }
      - name: Release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: JadwalkaIlmo APK ${{ github.run_number }}
          files: JadwalkaIlmo.apk
